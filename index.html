<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ChatBot | Coding</title>

    <!-- Google Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chatbot-popup">

    <!-- Header -->
    <div class="chat-header">
        <div class="header-info">

            <svg class="chatbot-logo" xmlns="http://www.w3.org/2000/svg"
                width="50" height="50" viewBox="0 0 64 64" fill="none">

                <rect x="10" y="16" width="44" height="36" rx="14" fill="currentColor"/>
                <path d="M32 16V8"
                    stroke="currentColor"
                    stroke-width="4"
                    stroke-linecap="round"/>
                <circle cx="32" cy="7" r="4" fill="currentColor"/>

                <circle cx="24" cy="33" r="5" fill="white"/>
                <circle cx="40" cy="33" r="5" fill="white"/>

                <circle cx="24" cy="33" r="2.5" fill="#667eea"/>
                <circle cx="40" cy="33" r="2.5" fill="#667eea"/>

                <path d="M23 43C27 47 37 47 41 43"
                    stroke="white"
                    stroke-width="3"
                    stroke-linecap="round"/>

            </svg>

            <h2 class="logo-text">ChatBot</h2>

        </div>

        <button id="close-chatbot" class="material-symbols-rounded">
            keyboard_arrow_down
        </button>
    </div>

    <!-- Body -->
    <div class="chat-body">

        <div class="message bot-message">

            <svg class="bot-avatar" xmlns="http://www.w3.org/2000/svg"
                width="50"
                height="50"
                viewBox="0 0 64 64"
                fill="none">

                <rect x="10" y="16" width="44" height="36" rx="14" fill="currentColor"/>
                <path d="M32 16V8"
                    stroke="currentColor"
                    stroke-width="4"
                    stroke-linecap="round"/>
                <circle cx="32" cy="7" r="4" fill="currentColor"/>

                <circle cx="24" cy="33" r="5" fill="white"/>
                <circle cx="40" cy="33" r="5" fill="white"/>

                <circle cx="24" cy="33" r="2.5" fill="#667eea"/>
                <circle cx="40" cy="33" r="2.5" fill="#667eea"/>

                <path d="M23 43C27 47 37 47 41 43"
                    stroke="white"
                    stroke-width="3"
                    stroke-linecap="round"/>

            </svg>

            <div class="message-text">
                Hey there <br>
                How can I help you Today? 👋🏻
            </div>

        </div>

    </div>

    <!-- Footer -->
    <div class="chat-footer">

        <form class="chat-form">

            <textarea
                class="message-input"
                placeholder="Message..."
                rows="1"
                required></textarea>

            <div class="chat-controls">

                <button type="button" class="material-symbols-rounded">
                    sentiment_satisfied
                </button>

                <button type="button" class="material-symbols-rounded">
                    attach_file
                </button>

                <button type="submit"
                    id="send-message"
                    class="material-symbols-rounded">
                    arrow_upward
                </button>

            </div>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
